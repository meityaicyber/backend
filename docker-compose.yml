version: "3.8"

networks:
  public_net:
  private_net:

volumes:
  postgres_data:
    driver: local
  seaweedfs_data:
    driver: local
  seaweedfs_master_data:
    driver: local
  seaweedfs_filer_data:
    driver: local
  redpanda_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

services:
  postgres:
    image: postgres:16
    container_name: cyber-audit-db
    environment:
      POSTGRES_DB: cyber_audit
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-supersecretpassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - private_net
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cyber_audit"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: cyber-audit-redis
    command: redis-server --maxmemory 256mb --maxmemory-policy volatile-ttl
    networks:
      - private_net
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M
    restart: unless-stopped

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: cyber-audit-redpanda
    command:
      - redpanda
      - start
      - --smp 1
      - --memory 1G
      - --reserve-memory 0M
      - --overprovisioned
      - --node-id 0
      - --check=false
      - --kafka-addr PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:9092
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    networks:
      - private_net
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
    restart: unless-stopped

  seaweedfs-master:
    image: chrislusf/seaweedfs:latest
    container_name: cyber-audit-seaweedfs-master
    command: "master -ip=seaweedfs-master -ip.bind=0.0.0.0"
    volumes:
      - seaweedfs_master_data:/data
    networks:
      - private_net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9333/cluster/status"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  seaweedfs-volume:
    image: chrislusf/seaweedfs:latest
    container_name: cyber-audit-seaweedfs-volume
    command: "volume -mserver=seaweedfs-master:9333 -ip.bind=0.0.0.0 -port=8082"
    depends_on:
      seaweedfs-master:
        condition: service_healthy
    volumes:
      - seaweedfs_data:/data
    networks:
      - private_net
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
    restart: unless-stopped

  seaweedfs-filer:
    image: chrislusf/seaweedfs:latest
    container_name: cyber-audit-seaweedfs-filer
    command: "filer -master=seaweedfs-master:9333 -ip.bind=0.0.0.0"
    depends_on:
      seaweedfs-master:
        condition: service_healthy
      seaweedfs-volume:
        condition: service_started
    volumes:
      - seaweedfs_filer_data:/data
    networks:
      - private_net
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8888/"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  ingestion-api:
    build:
      context: ./ingestion_api
      dockerfile: Dockerfile
    container_name: cyber-audit-ingestion-api
    depends_on:
      - postgres
      - redis
      - redpanda
    environment:
      REDIS_URL: redis://redis:6379
      KAFKA_BROKER: redpanda:9092
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-supersecretpassword}@postgres:5432/cyber_audit
    ports:
      - "8080:8080"
    networks:
      - public_net
      - private_net
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    restart: unless-stopped

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    depends_on:
      - postgres
      - redis
      - redpanda
      - seaweedfs-filer
    environment:
      REDIS_URL: redis://redis:6379
      KAFKA_BROKER: redpanda:9092
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-supersecretpassword}@postgres:5432/cyber_audit
      SEAWEEDFS_FILER_URL: http://seaweedfs-filer:8888
      AI_PIPELINE_URL: http://ai-pipeline:8001
    networks:
      - private_net
    deploy:
      mode: replicated
      replicas: 4
      resources:
        limits:
          cpus: '2'
          memory: 2G
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cyber-audit-backend
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs-filer:
        condition: service_healthy
      ai-pipeline:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${DB_PASSWORD:-supersecretpassword}@postgres:5432/cyber_audit
      SECRET_KEY: ${SECRET_KEY:-change-this-to-a-secure-256-bit-key-in-production}
      FRONTEND_URL: http://localhost:3000
      SEAWEEDFS_FILER_URL: ${SEAWEEDFS_FILER_URL:-http://seaweedfs-filer:8888}
      AI_PIPELINE_URL: http://ai-pipeline:8001
    ports:
      - "8000:8000"
    networks:
      - public_net
      - private_net
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
    restart: unless-stopped

  ai-pipeline:
    build:
      context: ./ai_pipeline
      dockerfile: Dockerfile
    container_name: cyber-audit-ai-pipeline
    networks:
      - private_net
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    container_name: cyber-audit-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - public_net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    restart: unless-stopped

  adminer:
    image: adminer:latest
    container_name: cyber-audit-adminer
    ports:
      - "8081:8080"
    depends_on:
      - postgres
    networks:
      - public_net
      - private_net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    restart: unless-stopped

  clamav:
    image: clamav/clamav:latest
    container_name: cyber-audit-clamav
    networks:
      - private_net
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: cyber-audit-prometheus
    volumes:
      - prometheus_data:/prometheus
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - private_net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: cyber-audit-grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    networks:
      - public_net
      - private_net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    restart: unless-stopped

  custom-dashboard:
    image: nginx:alpine
    container_name: cyber-audit-dashboard
    ports:
      - "4000:80"
    volumes:
      - ./dashboard:/usr/share/nginx/html:ro
    networks:
      - public_net
