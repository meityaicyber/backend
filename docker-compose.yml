volumes:
  postgres_data:
    driver: local
  seaweedfs_data:
    driver: local

services:
  postgres:
    image: postgres:16
    container_name: cyber-audit-db
    environment:
      POSTGRES_DB: cyber_audit
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-supersecretpassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cyber_audit"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  seaweedfs-master:
    image: chrislusf/seaweedfs:latest
    container_name: cyber-audit-seaweedfs-master
    command: "master -ip=seaweedfs-master -ip.bind=0.0.0.0"
    ports:
      - "9333:9333"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9333/cluster/status"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  seaweedfs-volume:
    image: chrislusf/seaweedfs:latest
    container_name: cyber-audit-seaweedfs-volume
    command: "volume -mserver=seaweedfs-master:9333 -ip.bind=0.0.0.0 -port=8082"
    depends_on:
      seaweedfs-master:
        condition: service_healthy
    volumes:
      - seaweedfs_data:/data
    ports:
      - "8082:8082"
    restart: unless-stopped

  seaweedfs-filer:
    image: chrislusf/seaweedfs:latest
    container_name: cyber-audit-seaweedfs-filer
    command: "filer -master=seaweedfs-master:9333 -ip.bind=0.0.0.0"
    depends_on:
      seaweedfs-master:
        condition: service_healthy
      seaweedfs-volume:
        condition: service_started
    ports:
      - "8888:8888"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8888/"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cyber-audit-backend
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs-filer:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${DB_PASSWORD:-supersecretpassword}@postgres:5432/cyber_audit
      SECRET_KEY: ${SECRET_KEY:-change-this-to-a-secure-256-bit-key-in-production}
      FRONTEND_URL: http://localhost:3000
      SEAWEEDFS_FILER_URL: ${SEAWEEDFS_FILER_URL:-http://seaweedfs-filer:8888}
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    container_name: cyber-audit-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"
    restart: unless-stopped

  adminer:
    image: adminer:latest
    container_name: cyber-audit-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  clamav:
    image: clamav/clamav:latest
    container_name: cyber-audit-clamav
    restart: unless-stopped
    ports:
      - "3310:3310"
